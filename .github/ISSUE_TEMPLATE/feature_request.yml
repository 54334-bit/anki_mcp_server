name: ✨ Feature Request
description: Suggest a new tool, improvement, or enhancement
title: "[feat]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please search existing issues first.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case. What are you trying to do that the current tools don't support?
      placeholder: "I want to be able to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What tool or behavior would you like to see? Include proposed input/output if possible.
      placeholder: |
        Tool name: `exportDeck`
        Input: { deck: "Japanese::JLPT N5", format: "apkg" }
        Output: { file: "/path/to/export.apkg" }
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you tried working around this with existing tools? Why didn't it work?

  - type: checkboxes
    id: willing
    attributes:
      label: Willing to contribute?
      options:
        - label: I am willing to submit a PR for this feature
          required: false
