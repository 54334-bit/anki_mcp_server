name: 🐛 Bug Report
description: Report something that is not working as expected
title: "[bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Before you submit,
        please search existing issues to avoid duplicates.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug. What did you expect to happen?
      placeholder: "When I called the `addNote` tool, I expected the note to appear in Anki, but instead..."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug.
      placeholder: |
        1. Start the server with `node dist/main-stdio.js`
        2. Send JSON-RPC `tools/call` with method `addNote` and args...
        3. Observe error in stderr
    validations:
      required: true

  - type: dropdown
    id: transport
    attributes:
      label: Transport mode
      options:
        - STDIO
        - HTTP
        - Tunnel
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Server version
      description: Run `node dist/main-stdio.js --version` or check `package.json`.
      placeholder: "0.20.1"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: "v22.12.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: textarea
    id: anki
    attributes:
      label: Anki / AnkiConnect info
      description: Anki version and AnkiConnect add-on version. Is Anki running?
      placeholder: "Anki 24.x, AnkiConnect latest, Anki was running"

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Server stderr output, MCP client logs, or error stack traces. Paste between triple backticks.
      render: shell

  - type: textarea
    id: health-check
    attributes:
      label: Health-check output
      description: If possible, run `node scripts/health-check.mjs` and paste the output here.
      render: shell
